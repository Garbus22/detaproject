<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous">
        </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        $(function () {
            let dlugosclisty = 0;
            let dokupienia = 0;
            let kupione = 0;
            $("#formularz").submit(function (e) {
                e.preventDefault()
                let nazwa = $("#polenazwa").val().trim()
                let ilosc = $("#poleilosc").val()
                if (nazwa == "" && ilosc == "") {
                    $("#komunikat").text("Oba Pola musza byc uzupełnione").css("color", "red")
                } else if (nazwa == "") {
                    $("#komunikat").text("Pole z nazwa musi byc uzupełnione").css("color", "red")
                } else if (ilosc == "") {
                    $("#komunikat").text("Podaj ilosc").css("color", "red")
                } else if (ilosc <= 0) {
                    $("#komunikat").text("Podaj ilosc wieksza od zera").css("color", "red")
                } else {
                    ++dokupienia
                    $("#dokupienia").text("Do kupienia: " + dokupienia + " kupione: " + kupione)
                    $("#lista").append("<li><span class='produkt'>" + nazwa + " - " + ilosc + " szt. </span> <button id='usun'> Usun </button> </li>")
                    $("#komunikat").text("")
                    $("#informacja").hide()
                }

            })
            $(document).on("click", "#usun", function () {
                $(this).parent().remove()
                --dokupienia;
                $("#dokupienia").text("Do kupienia: " + dokupienia + " kupione: " + kupione)
                dlugosclisty = 0;
                $("li").each(function(){
                    lugosclisty++;
                })
                if(dlugosclisty == 0){
                    $("#informacja").show()
                }
            })
            $(document).on("click", ".produkt", function () {
                $(this).toggleClass("kupiony")
                if ($(this).hasClass("kupiony")) {
                    ++kupione;
                    --dokupienia;
                    $("#dokupienia").text("Do kupienia: " + dokupienia + " kupione: " + kupione)
                } else {
                    --kupione;
                    ++dokupienia;
                    $("#dokupienia").text("Do kupienia: " + dokupienia + " kupione: " + kupione)
                }
            })
            $(document).on("click", "#usunkupione", function() {
                let ilosckupionych = 0
                $(".kupiony").each(function(){
                    ilosckupionych++
                })
                kupione = kupione - ilosckupionych
                $(".kupiony").parent().remove()
                $("#dokupienia").text("Do kupienia: " + dokupienia + " kupione: " + kupione)
                dlugosclisty = 0;
                $("li").each(function(){
                    dlugosclisty++;
                })
                if(dlugosclisty == 0){
                    $("#informacja").show()
                }
            })
        })
    </script>
</head>
<body>
    <form id="formularz">
        <input type="text" id="polenazwa">
        <input type="number" id="poleilosc">
        <button id="dodaj">Dodaj</button>
        <p id="kupione"></p>
        <p id="dokupienia"></p>
        <p id="komunikat"></p>
    </form>
    <button id="usunkupione">Usuń kupione</button>
    <ul id="lista">
        <p id="informacja">Lista jest pusta</p>
    </ul>
</body>

</html>
